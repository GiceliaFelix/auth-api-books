services:
  db:
    image: postgres:16-alpine
    container_name: auth-api-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth_api_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - auth-api-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: auth-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/auth_api_db
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-41cf2b9c8e1a4d3b9f0e5a7c6d2b1f8e93a5c7d1b4f6e8a2c9d0b3f5e7a1c4d6}
    ports:
      - "8080:8080"

volumes:
  auth-api-db-data:
